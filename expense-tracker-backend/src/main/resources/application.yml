server:
    port: 8080

spring:
    application:
        name: expense-tracker-backend

    datasource:
        url: jdbc:postgresql://localhost:5432/expense_tracker_db
        username: postgres
        password: 2412
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        database-platform: org.hibernate.dialect.PostgreSQLDialect
    